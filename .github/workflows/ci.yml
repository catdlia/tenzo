name: Tenzo CI/CD

on:
  push:
    branches: [ master, main, experimental, develop ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read
  packages: write

env:
  BUILD_TYPE: Release

jobs:
  build-docker:
    name: Build & Cache Dev Container
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image exists in GHCR
        id: check-image
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/tenzo-dev:latest"
          EXISTS=false
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            EXISTS=true
          fi

          DOCKERFILE_CHANGED=false
          if git diff-tree --no-commit-id --name-only -r HEAD 2>/dev/null | grep -q "^Dockerfile$"; then
            DOCKERFILE_CHANGED=true
          fi

          if [ "$EXISTS" = "true" ] && [ "$DOCKERFILE_CHANGED" = "false" ]; then
            echo "build_needed=false" >> "$GITHUB_OUTPUT"
            echo "✅ Container image $IMAGE already exists in GHCR and Dockerfile unchanged. Skipping build."
          else
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
            echo "⚠️  Building container image $IMAGE (exists=$EXISTS, changed=$DOCKERFILE_CHANGED)..."
          fi

      - name: Build and Push Dev Container
        if: steps.check-image.outputs.build_needed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/tenzo-dev:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-test:
    name: Build & Test (x86_64 MLIR/AVX2)
    needs: build-docker
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository_owner }}/tenzo-dev:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup CCache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Configure CMake
        run: |
          cmake -B build -S . -GNinja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DTENZO_HAS_VULKAN=OFF

      - name: Build Targets
        run: ninja -C build tenzo-cli paper_benchmark

      - name: Run Unit Tests
        run: |
          ./build/tenzo-cli test

      - name: Run CPU MatMul Benchmark
        run: |
          echo "=== CPU MatMul Benchmark ==="
          ./build/tenzo-cli cpu 2>&1 | tee cpu_benchmark.txt

      - name: Run Conv2D Benchmark
        run: |
          echo "=== Conv2D Test ==="
          ./build/tenzo-cli conv2d 2>&1 | tee conv2d_test.txt

      - name: Run Paper Micro-Benchmark (1K Context)
        run: |
          echo "=== Paper Micro-Benchmark ==="
          ./build/paper_benchmark --context 1024 2>&1 | tee paper_benchmark.txt

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            cpu_benchmark.txt
            conv2d_test.txt
            paper_benchmark.txt

  rpi4-arm64-benchmark:
    name: ARM64 Native Benchmark (Raspberry Pi 4B)
    runs-on: [self-hosted, rpi4]
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Paper Micro-Benchmark (ARM NEON)
        run: |
          g++ -O3 -march=native -fopenmp src/tests/PaperMicroBenchmark.cpp -o paper_benchmark

      - name: Run ARM Micro-Benchmark
        run: |
          ./paper_benchmark --context 1024 --iters 5 2>&1 | tee rpi_benchmark.txt

      - name: Upload RPi Benchmark
        uses: actions/upload-artifact@v4
        with:
          name: rpi-benchmark-results
          path: rpi_benchmark.txt

  benchmark-report:
    name: Generate Benchmark Summary
    needs: [build-and-test, rpi4-arm64-benchmark]
    runs-on: ubuntu-24.04
    if: always() && needs.build-and-test.result == 'success'
    steps:
      - name: Download x86 Benchmark Results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results

      - name: Download RPi Benchmark Results (if available)
        uses: actions/download-artifact@v4
        with:
          name: rpi-benchmark-results
        continue-on-error: true

      - name: Parse and Report Results
        run: |
          echo "## 📊 Tenzo Benchmark Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 CPU MatMul (512x512)" >> $GITHUB_STEP_SUMMARY
          grep -E "Speedup|Scalar:|Vector:" cpu_benchmark.txt >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎯 Conv2D Performance" >> $GITHUB_STEP_SUMMARY
          grep -E "Throughput|Per iteration" conv2d_test.txt >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔬 Paper Attention Micro-Benchmark (x86_64 AVX2)" >> $GITHUB_STEP_SUMMARY
          grep -E "Speedup|Baseline Allocated|Tenzo Allocated|Baseline FP32 Attention|Tenzo Packed Attention" paper_benchmark.txt >> $GITHUB_STEP_SUMMARY || true
          if [ -f "rpi_benchmark.txt" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🍓 ARM64 Native Benchmark (Raspberry Pi 4B)" >> $GITHUB_STEP_SUMMARY
            grep -E "Speedup|Baseline Allocated|Tenzo Allocated|Baseline FP32 Attention|Tenzo Packed Attention" rpi_benchmark.txt >> $GITHUB_STEP_SUMMARY || true
          fi
